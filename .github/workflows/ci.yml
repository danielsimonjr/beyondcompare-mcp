name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the PRODUCTION platform for this MCP server: it drives
        # BComp.com, a Windows executable. CI was Linux-only, so it never tested the
        # OS the server actually ships on. Linux stays in the matrix because the pure
        # logic (report parsing, exit-code mapping) must not become Windows-only.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      # NOT --if-present. That flag passes silently when a script is missing, so a
      # typo in a script name produces a green run that checked nothing. These four
      # all exist in package.json; if one is removed, CI should fail and say so.
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      # Test the artifact that ships, not the sources it was built from: start the
      # built server and confirm it speaks MCP.
      - run: node scripts/smoke.mjs
